# IoTelic JTAG-USB_V1.0, FT2232HL; observed USB identity, not an Olimex schematic.
# Bring-up assumes channel A MPSSE: AD0=CK, AD1=DI, AD2=DO, AD3=MS.
# No verified buffer/reset/LED wiring: leave all other FTDI GPIO as inputs.
adapter driver ftdi
ftdi vid_pid 0x15ba 0x002a
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 100
