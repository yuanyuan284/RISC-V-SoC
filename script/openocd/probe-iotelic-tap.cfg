# TAP identification only: no RISC-V target, CPU halt/reset, or RAM access.
source script/openocd/iotelic-ft2232h.cfg
transport select jtag
bindto 127.0.0.1
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
jtag newtap soc cpu -irlen 5 -expected-id 0x10002fff
init
# Unlike init's best-effort startup, propagate a failed chain check to the caller.
jtag arp_init
scan_chain
shutdown
